name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          log-public-key: false

      - name: Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            cd ~/anykit-app
            git pull origin main
            NODE_OPTIONS='--max-old-space-size=4096' npm install
            # Kill any stale next build process and clear the build lock
            pkill -f "next build" 2>/dev/null || true
            pkill -f "next/dist/bin/build" 2>/dev/null || true
            rm -f .next/build-state.json .next/cache/.*.lock 2>/dev/null || true
            NODE_OPTIONS='--max-old-space-size=4096' npm run build
            pm2 restart anykit-app
          EOF
